# =====================================================================
# DuoFlow — M0 Windows cloud build (runs on GitHub's hosted Windows VM)
# =====================================================================
# Purpose (EXECUTION_PLAN.md Phase 1 / M0.1):
#   - Verify the .NET 8 + WinUI 3 toolchain by building src/DuoFlow.App
#     on a real Windows environment in the cloud, so no local Windows
#     machine is required for build-level verification.
#   - Best-effort: launch the app headless, prove the process starts,
#     and capture a screenshot of the desktop.
#
# Runs automatically on every push touching src/ or this workflow,
# and can be triggered manually from the Actions tab (workflow_dispatch).
# =====================================================================

name: M0 Windows Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/m0-windows-build.yml"
  workflow_dispatch:

jobs:
  build-winui:
    name: Build & launch DuoFlow.App (WinUI 3)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain (.NET SDK / MSBuild)
        shell: pwsh
        run: |
          Write-Host "== dotnet SDKs ==";  dotnet --list-sdks
          Write-Host "== OS ==";          (Get-CimInstance Win32_OperatingSystem) | Select-Object Caption, BuildNumber, Version | Format-List

      # WinUI 3 must be built with VS MSBuild: the PRI/MRT build tasks
      # (Microsoft.Build.Packaging.Pri.Tasks.dll) ship with Visual Studio,
      # not with the dotnet SDK -> "dotnet build" fails with MSB4062.
      - name: Locate VS MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { Write-Error "VS MSBuild not found on runner" }
          Write-Host "MSBuild found: $msbuild"
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build DuoFlow.App (WinUI 3)
        shell: pwsh
        run: >
          & $env:MSBUILD_EXE "src/DuoFlow.App/DuoFlow.App.csproj"
          /restore /p:Configuration=Debug /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /bl:m0-build.binlog /nologo /v:m

      # ---- Best effort: launch overlay smoke + screenshot the desktop ----
      # GUI availability on hosted runners can vary; failures here must NOT
      # fail the job (the build gate above is the M0.1 acceptance criterion).
      # M0.3: the app now launches the fullscreen overlay + console and, in
      # --overlay-smoke mode, writes duoflow-overlay-smoke.json after ~10s.
      - name: Launch overlay smoke + screenshot (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/DuoFlow.App/bin" -Recurse -Filter "DuoFlow.App.exe" |
                 Where-Object { $_.FullName -notmatch "obj" } |
                 Select-Object -First 1
          if (-not $exe) { Write-Warning "DuoFlow.App.exe not found"; exit 0 }
          Write-Host "Launching: $($exe.FullName) --overlay-smoke"
          Start-Process -FilePath $exe.FullName -ArgumentList "--overlay-smoke"
          Start-Sleep -Seconds 16
          $p = Get-Process -Name "DuoFlow.App" -ErrorAction SilentlyContinue
          if ($p) {
            Write-Host "APP RUNNING OK  PID=$($p.Id)"
            $jsonPath = "$env:USERPROFILE\duoflow-overlay-smoke.json"
            if (Test-Path $jsonPath) {
              Write-Host "== OVERLAY SMOKE JSON =="
              Get-Content $jsonPath
              Copy-Item $jsonPath "$PWD/duoflow-overlay-smoke.json" -Force
            } else {
              Write-Warning "duoflow-overlay-smoke.json not written (app may have failed early)"
            }
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$PWD/duoflow-window.png")
              Write-Host "SCREENSHOT SAVED: $PWD/duoflow-window.png"
            } catch { Write-Warning "Screenshot failed: $_" }
            Stop-Process -Name "DuoFlow.App" -Force -ErrorAction SilentlyContinue
          } else {
            Write-Warning "App process not found after 16s (headless session may have blocked GUI startup)"
          }

      # ---- M0.3 acceptance gate: overlay window properties must all hold ----
      - name: Assert overlay properties (M0.3 gate)
        shell: pwsh
        run: |
          $jsonPath = "$PWD/duoflow-overlay-smoke.json"
          if (-not (Test-Path $jsonPath)) {
            Write-Error "smoke JSON missing — overlay did not report (see launch step log)"
            exit 1
          }
          $j = Get-Content $jsonPath | ConvertFrom-Json
          $fail = @()
          foreach ($prop in 'OverlayCreated','Fullscreen','Topmost','ClickThrough','NoActivate','ToolWindow','TransparentDwm') {
            if (-not $j.$prop) { $fail += $prop }
          }
          if ($j.MonitorCount -lt 1) { $fail += 'MonitorCount' }
          if ($fail.Count -gt 0) {
            Write-Error "M0.3 overlay checks FAILED: $($fail -join ', ')"
            exit 1
          }
          Write-Host "M0.3 overlay property checks PASSED (monitors=$($j.MonitorCount), capture=$($j.CaptureState), frames=$($j.CaptureFrames))"

      - name: Upload build log + screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-build-logs
          path: |
            m0-build.binlog
            duoflow-window.png
            duoflow-overlay-smoke.json
          if-no-files-found: ignore
